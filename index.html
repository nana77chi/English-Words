<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2430;--sub:#6b7280;--ac:#2f6fed;--ok:#16a34a;--ng:#dc2626;--bd:#e3e6ee;--star:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212b;--tx:#eef1f6;--sub:#9aa3b2;--bd:#2c3340}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212b;--tx:#eef1f6;--sub:#9aa3b2;--bd:#2c3340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.2rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;width:100%}
.btn.sub{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.4}
.pool{display:flex;gap:8px;margin-bottom:14px}
.pool button{flex:1;border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 4px;font-size:.85rem}
.pool button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.pool b{display:block;font-size:1.2rem}
.word{font-size:2.2rem;font-weight:800;text-align:center;margin:10px 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:.9rem}
.ch{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:13px 14px;margin-top:8px;font-size:1.02rem}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,var(--card))}
.mark{font-size:4rem;text-align:center;font-weight:800;height:74px;line-height:74px}
.mark.ok{color:var(--ok)}.mark.ng{color:var(--ng)}
.star{background:none;border:0;font-size:1.5rem;color:var(--bd);padding:2px 6px}
.star.on{color:var(--star)}
.spk{background:none;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:.9rem}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .e{font-weight:700;min-width:110px}.row .j{flex:1;color:var(--sub);font-size:.92rem}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--sub);font-size:.85rem}
nav button.on{color:var(--ac);font-weight:700}
.big{font-size:2.6rem;font-weight:800;text-align:center}
.muted{color:var(--sub);font-size:.88rem}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;margin-bottom:14px;align-items:center;font-size:.8rem}.mx .h{color:var(--sub);text-align:center}.mx button{border:2px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 2px;font-size:.78rem}.mx button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}.mx b{display:block;font-size:1.05rem}</style>

const gN=k=>k==='all'?W.length:W.filter(w=>String(w.g)===k).length;
const gradeRow=f=>`<div class="pool">${GR.map(([k,l])=>`<button class="${grade===k?'on':''}" onclick="grade='${k}';${f}"><b>${gN(k)}</b>${l}</button>`).join('')}</div>`;
const DR=[['all','すべて'],['1','やさしい'],['2','ふつう'],['3','むずかしい']];
const dN=k=>k==='all'?W.length:W.filter(w=>String(w.d)===k).length;
const diffRow=f=>`<div class="pool">${DR.map(([k,l])=>`<button class="${dif===k?'on':''}" onclick="dif='${k}';${f}"><b>${dN(k)}</b>${l}</button>`).join('')}</div>`;
const matrix=f=>`<div class="mx"><span></span>${[['1','やさしい'],['2','ふつう'],['3','むずかしい']].map(x=>`<span class="h">${x[1]}</span>`).join('')}${['1','2','3'].map(g=>`<span class="h">${g}年</span>`+['1','2','3'].map(d=>`<button class="${grade===g&&dif===d?'on':''}" onclick="grade='${g}';dif='${d}';${f}"><b>${W.filter(w=>String(w.g)===g&&String(w.d)===d).length}</b>語</button>`).join('')).join('')}</div>`;
const catN=k=>k==='all'?W.length:W.filter(w=>w.c===k).length;
const catRow=f=>`<div class="pool">${CATS.map(([k,l])=>`<button class="${cat===k?'on':''}" onclick="cat='${k}';${f}"><b>${catN(k)}</b>${l}</button>`).join('')}</div>`;
const poolIds=p=>(p==='fav'?[...fav]:p==='wrong'?[...wrong]:W.map(w=>w.id)).filter(id=>(cat==='all'||byId(id).c===cat)&&(grade==='all'||String(byId(id).g)===grade)&&(dif==='all'||String(byId(id).d)===dif));
const esc=s=>s.replace(/</g,'&lt;');
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);sv('fav',fav)}
function nav(){
  const t=[['test','テスト'],['list','単語帳'],['review','復習'],['stats','記録']];
  $('#nav').innerHTML=t.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${n}${k==='review'?` (${wrong.size})`:''}</button>`).join('');
}
function go(k){tab=k;T=null;if(k==='review')pool='wrong';render()}
function render(){nav();({test:rTest,list:rList,review:rReview,stats:rStats})[tab]()}
function rTest(){
  if(T&&T.i<T.q.length)return rQ();
  if(T)return rResult();
  rHome('単語テスト','10問のクイズです。意味を4つから選びましょう。');
}
function rReview(){
  if(T&&T.i<T.q.length)return rQ();
  if(T)return rResult();
  rHome('間違えた単語を復習','正解するとリストから消えます。全部消すのが目標!');
}
function rHome(title,desc){
  const n=p=>poolIds(p).length;
  const opts=tab==='review'?[['wrong','間違えた単語']]:[['all','全単語'],['fav','お気に入り'],['wrong','間違えた単語']];
  if(!opts.some(o=>o[0]===pool))pool=opts[0][0];
  $('#app').innerHTML=`<h1>${title}</h1><p class="muted">${desc}</p>
  <p class="muted" style="margin:0 0 6px">学年×難易度(タップで選択)</p>${matrix('render()')}<p class="muted" style="margin:0 0 6px">学年</p>${gradeRow('render()')}<p class="muted" style="margin:0 0 6px">難易度</p>${diffRow('render()')}<p class="muted" style="margin:0 0 6px">出題する種類</p>${catRow('render()')}<p class="muted" style="margin:0 0 6px">出題形式</p><div class="pool">${[['choice','英→日(4択)'],['rev','日→英(4択)'],['spell','日→英(つづり)']].map(([k,l])=>`<button class="${mode===k?'on':''}" onclick="mode='${k}';render()">${l}</button>`).join('')}</div>
  <div class="pool">${opts.map(([k,l])=>`<button class="${pool===k?'on':''}" onclick="pool='${k}';render()"><b>${n(k)}</b>${l}</button>`).join('')}</div>
  <button class="btn" ${n(pool)<1?'disabled':''} onclick="start()">${n(pool)<1?'対象の単語がありません':'スタート'}</button>`;
}
function start(){
  const ids=shuf(poolIds(pool)).slice(0,pool==='wrong'?30:10);
  T={q:ids,i:0,ok:[],ng:[],ans:null};render();
}
function rQ(){
  const w=byId(T.q[T.i]),a=T.ans,sp=mode==='spell',rv=mode==='rev';
  if(!sp&&!T.opts){const d=shuf(W.filter(x=>x.id!==w.id&&x.c===w.c&&(rv?x.e!==w.e:x.j!==w.j))).slice(0,3);T.opts=shuf([w,...d])}
  const qt=(sp||rv)?w.j:w.e;
  let body;
  if(sp){
    const col=a?(a.c?'var(--ok)':'var(--ng)'):'var(--bd)';
    body=`<input id="sp" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${w.e.length}文字" value="${esc(a?a.v:(T.draft||''))}" ${a?'disabled':''} oninput="T.draft=this.value" onkeydown="if(event.key==='Enter')submitSp()" style="width:100%;padding:13px;font-size:1.2rem;border:2px solid ${col};border-radius:12px;background:var(--card);color:var(--tx);text-align:center">`+(a?`<p style="text-align:center;font-size:1.2rem">正解: <b>${esc(w.e)}</b></p>`:`<button class="btn" style="margin-top:10px" onclick="submitSp()">答える</button>`);
  }else{
    body=T.opts.map(o=>{const t=rv?o.e:o.j;return `<button class="ch ${a?(o.id===w.id?'ok':(o.id===a.id?'ng':'')):''}" ${a?'disabled':''} onclick="pick(${o.id})">${esc(t)}</button>`}).join('');
  }
  $('#app').innerHTML=`<div class="top"><span>${T.i+1} / ${T.q.length}</span><span>◎ ${T.ok.length}　× ${T.ng.length}</span></div>
  <div class="bar"><i style="width:${T.i/T.q.length*100}%"></i></div>
  <div class="card"><div style="text-align:right"><button class="star ${fav.has(w.id)?'on':''}" onclick="toggleFav(${w.id});rQ()">★</button></div>
  <div class="word" style="${qt===w.j?'font-size:1.7rem':''}">${esc(qt)}</div>
  ${(!sp&&!rv)||a?`<div style="text-align:center;margin-bottom:6px"><button class="spk" onclick="speak('${w.e}')">🔊 発音</button></div>`:''}
  <div class="mark ${a?(a.c?'ok':'ng'):''}">${a?(a.c?'◎':'×'):''}</div>
  ${body}</div>
  ${a?`<button class="btn" onclick="nextQ()">${T.i+1<T.q.length?'次へ':'結果を見る'}</button>`:''}`;
  if(sp&&!a)setTimeout(()=>{const e=$('#sp');e&&e.focus()},50);
}
function fin(c,ans){
  const w=byId(T.q[T.i]);T.ans=ans;
  if(c){T.ok.push(w.id);wrong.delete(w.id)}else{T.ng.push(w.id);wrong.add(w.id)}
  stats[w.id]=stats[w.id]||[0,0];stats[w.id][c?0:1]++;saveStats();sv('wrong',wrong);nav();rQ();
}
function pick(id){fin(id===byId(T.q[T.i]).id,{id,c:id===byId(T.q[T.i]).id})}
function submitSp(){
  const v=($('#sp').value||'').trim();if(!v||T.ans)return;
  const c=v.toLowerCase()===byId(T.q[T.i]).e.toLowerCase();
  fin(c,{c,v});
}
function nextQ(){T.i++;T.ans=null;T.opts=null;T.draft='';render()}
function rResult(){
  const n=T.q.length,s=T.ok.length;
  $('#app').innerHTML=`<h1>結果</h1><div class="card"><div class="big">${s} / ${n}</div>
  <p class="muted" style="text-align:center">${s===n?'全問正解!すばらしい!':s>=n*0.7?'よくできました!':'間違えた単語をもう一度やってみよう'}</p></div>
  ${T.ng.length?`<div class="card"><b>間違えた単語</b>${T.ng.map(id=>{const w=byId(id);return `<div class="row"><span class="e">× ${esc(w.e)}</span><span class="j">${esc(w.j)}</span></div>`}).join('')}</div>
  <button class="btn" onclick="retry()">間違えた単語だけ再テスト</button><div style="height:8px"></div>`:''}
  <button class="btn sub" onclick="T=null;render()">もどる</button>`;
}
function retry(){T={q:shuf(T.ng),i:0,ok:[],ng:[],ans:null};render()}
function rStats(){
  const k=sview==='ok'?0:1;
  const all=Object.keys(stats).map(Number).filter(id=>byId(id)&&(cat==='all'||byId(id).c===cat)&&(grade==='all'||String(byId(id).g)===grade)&&(dif==='all'||String(byId(id).d)===dif));
  const r=all.filter(id=>stats[id][k]>0).sort((a,b)=>stats[b][k]-stats[a][k]||a-b);
  const nOk=all.filter(id=>stats[id][0]>0).length,nNg=all.filter(id=>stats[id][1]>0).length;
  const tot=all.reduce((t,id)=>[t[0]+stats[id][0],t[1]+stats[id][1]],[0,0]);
  $('#app').innerHTML=`<h1>学習の記録</h1>${matrix('rStats()')}${gradeRow('rStats()')}${diffRow('rStats()')}${catRow('rStats()')}
  <div class="pool"><button class="${k===0?'on':''}" onclick="sview='ok';rStats()"><b>${nOk}</b>◎ 正解した単語</button><button class="${k===1?'on':''}" onclick="sview='ng';rStats()"><b>${nNg}</b>× 不正解の単語</button></div>
  <p class="muted">これまでの合計: ◎ ${tot[0]}回 / × ${tot[1]}回(回数の多い順)</p>
  <div class="card">${r.length?r.map(id=>{const w=byId(id),st=stats[id];return `<div class="row"><span class="e" style="color:var(${k?'--ng':'--ok'})">${k?'×':'◎'} ${esc(w.e)}</span><span class="j">${esc(w.j)}</span><span style="text-align:right;font-size:.85rem"><b style="font-size:1.1rem">${st[k]}回</b><br><span class="muted">◎${st[0]} ×${st[1]}</span></span></div>`}).join(''):'<p class="muted">まだ記録がありません。テストをすると回数が記録されます。</p>'}</div>`;
}
function rList(){
  $('#app').innerHTML=`<h1>単語帳</h1><input type="search" id="q" placeholder="英語・日本語で検索" oninput="drawList()">
  ${matrix('rList()')}${gradeRow('rList()')}${diffRow('rList()')}${catRow('rList()')}<div class="pool">${[['all','全部'],['fav','★お気に入り'],['wrong','× 苦手']].map(([k,l])=>`<button class="${filt===k?'on':''}" onclick="filt='${k}';rList()">${l}</button>`).join('')}</div>
  <div class="card" id="list"></div>`;
  drawList();
}
function drawList(){
  const q=($('#q').value||'').toLowerCase();
  const ids=new Set(poolIds(filt));
  const r=W.filter(w=>ids.has(w.id)&&(w.e.includes(q)||w.j.includes(q))).sort((a,b)=>a.d-b.d);
  $('#list').innerHTML=r.length?r.map(w=>`<div class="row"><button class="star ${fav.has(w.id)?'on':''}" onclick="toggleFav(${w.id});drawList()">★</button><span class="e">${esc(w.e)}</span><span class="j">${esc(w.j)}</span><span class="muted" style="font-size:.7rem;color:var(--star)">${'★'.repeat(w.d)}</span><button class="spk" onclick="speak('${w.e}')">🔊</button></div>`).join(''):'<p class="muted">該当する単語がありません</p>';
}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body></html>
